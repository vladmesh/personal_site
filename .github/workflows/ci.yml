name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  backend-checks:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the dev image once with a layer cache, reuse it for every check.
      - name: Build backend test image
        uses: docker/build-push-action@v5
        with:
          context: services/backend
          file: services/backend/Dockerfile
          target: development
          tags: personal-site-backend-test:latest
          load: true
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      # Single container run: lint, typecheck and the full test suite (one pytest
      # pass covers unit + integration; the markers only filter, they don't add
      # tests the unmarked run would miss). test-db comes up via depends_on.
      - name: Lint, typecheck and test
        run: |
          cd infra
          docker compose -f docker-compose.test.yml run --rm backend-test sh -c "\
            ruff check . && \
            mypy src/ && \
            pytest --cov=app --cov-report=term-missing -v"

      - name: Cleanup
        if: always()
        run: |
          cd infra
          docker compose -f docker-compose.test.yml down -v
