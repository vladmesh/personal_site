name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# Let an in-flight deploy finish before the next one starts; never cancel mid-deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Registry owner derived from the repo, so forks build under their own account.
  # ghcr requires a lowercase owner; rename here if your GitHub login has capitals.
  REGISTRY_OWNER: ${{ github.repository_owner }}
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/personal_site/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/personal_site/frontend
  # Public domain, used only for the post-deploy smoke check (SITE_DOMAIN repo variable).
  # The running stack reads its domain and brand from the host's .env.
  SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
  # Stack directory on the host, relative to the deploy user's home (DEPLOY_DIR repo variable).
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'personal_site' }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Only rebuild an image whose service actually changed. workflow_dispatch forces both.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'services/backend/**'
            frontend:
              - 'services/frontend/**'

  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    needs: [ci, changes]
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: services/backend
          file: services/backend/Dockerfile
          target: production
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: [ci, changes]
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: services/frontend
          file: services/frontend/Dockerfile
          target: production
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Production runs on a shared host as an unprivileged user with rootless Docker,
  # behind a Cloudflare Tunnel (infra/docker-compose.tunnel.yml). Ground rules for that host:
  # no sudo, nothing outside DEPLOY_DIR, no image/volume prune (the same rootless daemon runs
  # other projects), and the host's .env is never written: it holds the live DB password,
  # admin hash and tunnel token, and is the only copy of them.
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [ci, build-backend, build-frontend]
    # Run as long as CI passed and no build failed. Skipped builds (unchanged
    # service) are not failures, so an infra-only push still redeploys.
    if: ${{ !cancelled() && !failure() }}
    # The VPS_* secrets live in this environment (deployments from main only); the repo-level
    # VPS_* secrets are stale and point at a host that no longer exists.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            Port ${{ secrets.VPS_SSH_PORT }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
          EOF

      - name: Check the deploy directory on VPS
        run: |
          ssh vps "DEPLOY_DIR='${DEPLOY_DIR}' bash -s" <<'REMOTE'
          set -e
          mkdir -p "$DEPLOY_DIR/cv"
          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "::error::$DEPLOY_DIR/.env is missing on the host; create it by hand (see infra/docker-compose.tunnel.yml)"
            exit 1
          fi
          REMOTE

      - name: Copy configs to VPS
        run: |
          scp infra/docker-compose.tunnel.yml "vps:${DEPLOY_DIR}/docker-compose.yml"
          scp infra/configs/Caddyfile.tunnel "vps:${DEPLOY_DIR}/Caddyfile"

      - name: Deploy and verify
        run: |
          ssh vps "DEPLOY_DIR='${DEPLOY_DIR}' REGISTRY_OWNER='${REGISTRY_OWNER}' bash -s" <<'REMOTE'
          set -e
          export DOCKER_HOST="unix:///run/user/$(id -u)/docker.sock"
          cd "$DEPLOY_DIR"
          # The images are public, so no registry login: a stored ghcr credential would
          # replace the one other projects on this host rely on. Only our two images are
          # pulled, so postgres, caddy and cloudflared are not swapped under the tunnel.
          docker compose pull backend frontend
          docker compose up -d

          echo "Waiting for backend and frontend healthchecks..."
          for i in $(seq 1 24); do
            states=$(docker compose ps --format '{{.Service}}={{.Health}}')
            echo "$states"
            if echo "$states" | grep -q "backend=healthy" && echo "$states" | grep -q "frontend=healthy"; then
              echo "Services healthy."
              break
            fi
            if [ "$i" = "24" ]; then
              echo "::error::services did not become healthy within ~2 min"
              docker compose ps
              docker compose logs --tail=80 backend frontend
              exit 1
            fi
            sleep 5
          done
          docker compose ps
          REMOTE

      - name: Smoke check through the tunnel
        if: ${{ env.SITE_DOMAIN != '' }}
        run: |
          for path in /en/ /ru/ /api/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "https://${SITE_DOMAIN}${path}")
            echo "${path} -> ${code}"
            if [ "$code" != 200 ]; then
              echo "::error::https://${SITE_DOMAIN}${path} returned ${code}"
              exit 1
            fi
          done
