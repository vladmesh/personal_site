name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# Let an in-flight deploy finish before the next one starts; never cancel mid-deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Registry owner derived from the repo, so forks build under their own account.
  # ghcr requires a lowercase owner; rename here if your GitHub login has capitals.
  REGISTRY_OWNER: ${{ github.repository_owner }}
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/personal_site/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/personal_site/frontend
  # Public domain Caddy serves and requests a TLS cert for. Set the SITE_DOMAIN
  # repo variable (Settings > Secrets and variables > Actions > Variables).
  SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'example.com' }}
  # Display name shown in the site header, footer, and meta titles (SITE_BRAND repo variable).
  SITE_BRAND: ${{ vars.SITE_BRAND || 'Your Name' }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Only rebuild an image whose service actually changed. workflow_dispatch forces both.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/backend/**'
            frontend:
              - 'services/frontend/**'

  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    needs: [ci, changes]
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: services/backend
          file: services/backend/Dockerfile
          target: production
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: [ci, changes]
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: services/frontend
          file: services/frontend/Dockerfile
          target: production
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [ci, build-backend, build-frontend]
    # Run as long as CI passed and no build failed. Skipped builds (unchanged
    # service) are not failures, so an infra-only push still redeploys.
    if: ${{ !cancelled() && !failure() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Bootstrap deploy directory on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            sudo mkdir -p /opt/services/personal_site/configs
            sudo chown -R ${{ secrets.VPS_USER }}:${{ secrets.VPS_USER }} /opt/services/personal_site
          '

      - name: Copy configs to VPS
        run: |
          scp -i ~/.ssh/id_ed25519 -P ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no infra/docker-compose.prod.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/services/personal_site/docker-compose.yml
          scp -i ~/.ssh/id_ed25519 -P ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no infra/configs/Caddyfile ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/services/personal_site/configs/Caddyfile

      - name: Deploy and verify
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -e
            cd /opt/services/personal_site
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" > .env
            echo "ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}" >> .env
            echo "ADMIN_PASSWORD_HASH=${{ secrets.ADMIN_PASSWORD_HASH }}" >> .env
            echo "ADMIN_SECRET_KEY=${{ secrets.ADMIN_SECRET_KEY }}" >> .env
            echo "SITE_DOMAIN=${{ env.SITE_DOMAIN }}" >> .env
            echo "SITE_BRAND=${{ env.SITE_BRAND }}" >> .env
            echo "REGISTRY_OWNER=${{ github.repository_owner }}" >> .env
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f

            echo "Waiting for backend and frontend healthchecks..."
            for i in $(seq 1 24); do
              states=$(sudo docker compose ps --format "{{.Service}}={{.Health}}")
              echo "$states"
              if echo "$states" | grep -q "backend=healthy" && echo "$states" | grep -q "frontend=healthy"; then
                echo "Services healthy."
                break
              fi
              if [ "$i" = "24" ]; then
                echo "::error::services did not become healthy within ~2 min"
                sudo docker compose ps
                sudo docker compose logs --tail=80
                exit 1
              fi
              sleep 5
            done
            sudo docker compose ps
          '
