[tool.poetry]
name = "personal-site-backend"
version = "0.1.0"
description = "Backend service for personal site"
authors = ["Vlad Mesh"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
asyncpg = "^0.30.0"
pydantic-settings = "^2.6.0"
sqladmin = "^0.20.0"
itsdangerous = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
aiosqlite = "^0.21.0"
pre-commit = "^4.0.0"

[tool.ruff]
line-length = 100
target-version = "py312"
# /app is bind-mounted from the host in dev/CI containers and may be owned by a
# different uid than the container's appuser, so cache dirs live outside it in /tmp.
cache-dir = "/tmp/personal-site-backend/ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["B008"]  # FastAPI Depends() in function defaults is intentional


[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
cache_dir = "/tmp/personal-site-backend/mypy_cache"

[[tool.mypy.overrides]]
module = "sqladmin.*"
ignore_missing_imports = true

[tool.coverage.run]
data_file = "/tmp/personal-site-backend/.coverage"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = "/tmp/personal-site-backend/pytest_cache"
markers = [
    "unit: Unit tests using in-memory SQLite",
    "integration: Integration tests using real PostgreSQL and HTTP requests"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
